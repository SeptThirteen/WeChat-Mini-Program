services:
  mysql:
    image: mysql:8.0
    container_name: yinling-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wechat_elderly
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动(空数据卷)自动执行:按文件名字母序 init.sql 先于 migration-*.sql
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: yinling-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 容器内无 application-dev.yml,数据源/密钥全部由环境变量注入
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wechat_elderly?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMS_CODE_RETURN_IN_RESPONSE: ${SMS_CODE_RETURN_IN_RESPONSE:-true}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-BAIDU}
      AI_BAIDU_API_KEY: ${AI_BAIDU_API_KEY:-}
      AI_BAIDU_SECRET_KEY: ${AI_BAIDU_SECRET_KEY:-}
      AI_TENCENT_SECRET_ID: ${AI_TENCENT_SECRET_ID:-}
      AI_TENCENT_SECRET_KEY: ${AI_TENCENT_SECRET_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
