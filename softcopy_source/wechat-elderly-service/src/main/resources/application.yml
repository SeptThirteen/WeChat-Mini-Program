server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: wechat-elderly-service
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: "change-this-secret-key-please-32chars-min"
  expire-hours: 168

# 短信验证码（内存版演示实现，未接真实短信网关）
sms:
  code:
    expire-seconds: 300            # 验证码有效期
    resend-cooldown-seconds: 60    # 重发冷却
    # true 时 /api/auth/sms-code 响应回显 devCode（仅限开发联调，生产环境必须为 false）
    return-in-response: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# AI provider config (override in application-dev.yml)
ai:
  default-provider: BAIDU
  baidu:
    api-key: "YOUR_BAIDU_API_KEY"
    secret-key: "YOUR_BAIDU_SECRET_KEY"
  tencent:
    secret-id: "YOUR_TENCENT_SECRET_ID"
    secret-key: "YOUR_TENCENT_SECRET_KEY"
